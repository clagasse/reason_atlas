<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reason Atlas</title>
    <script>
      // SPA fallback for GitHub Pages (handles both root and /<repo-name>/ project pages)
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('reason-atlas-spa-redirect', path);
      var segments = window.location.pathname.split('/').filter(Boolean);
      var base = segments.length > 1 ? '/' + segments[0] + '/' : '/';
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
